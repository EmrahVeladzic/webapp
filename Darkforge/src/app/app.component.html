<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>
        Darkforge
    </title>


</head>
<body>
    
    <input type="file" id="file_upload" #file_input (change)="file_logic($event)">
    <label for="file_upload">file_input</label>

    <div class="top_menu">
        <button type="button"><b>Export</b></button>
        <a (click)="upload_click()">Manage files</a>
    </div>

    

    <div class="main_segment">

        <div class="canvas_holder">

            <app-renderer></app-renderer>

        </div>
        

    
        <div class="side_menu">
            <app-file-transfer [Menu]="transfer.Menu" [transfer]="transfer"></app-file-transfer>
        </div>

    </div>
   
    <div class="dashboard">
        
        <app-dashboard [transfer]="transfer"></app-dashboard>
        
    </div>
    
    <div class="footer">
        <a>About</a>
        <a>Preferences</a>
    </div>

   

</body>
</html>
