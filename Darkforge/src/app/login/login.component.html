<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
  
</head>
<body>

    <h1>Darkforge</h1>
    <div id="user" class="central">

       <div class="data">
        <div class="data_row">
            <label for="username">ID:</label>
            <input [(ngModel)]="username" id="username" type="text">
        </div>
        <div class="data_row">
            <label for="password">*****:</label>
            <input [(ngModel)]="password" id="password" type="password">
        </div>
       </div>

       <div class="button">
            <button id="login" (click)="login()" type="button">=></button>
       </div>

    </div>



</body>
</html>
