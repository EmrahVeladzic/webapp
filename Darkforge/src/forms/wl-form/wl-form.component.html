<!DOCTYPE html>
<meta charset="utf-8">
<head>

</head>

<body>

   <div class="wl_input">
    <app-audio-player #player></app-audio-player>
   </div>

   <form [formGroup]="form">

      <div class="params">

         
         <div class="threshold_holder">
            <label>{{'label.differential'|translate}}</label>
            <div class="threshold">
               <div class="threshold_s">
                  <app-slider id="t_slider" [vertical]="true" [min]="4" [max]="12" [default]="10" [step]="2" formControlName="t_slider"></app-slider>           
               </div>
               <div class="threshold_n">
                  <app-numeric id="t_numeric" [min]="4" [max]="12" [default]="10" [step]="2" formControlName="t_numeric"></app-numeric>
               </div>
            </div>
         
       
         </div>

         <div class="loop_single">
            <label for="loop">{{'label.loop'|translate}}</label>
            <input type="checkbox" id="loop" #loop formControlName="loop">
         </div>


      </div>

   </form>

   <div class="btn">
      <button type="button" [disabled]="!btn_enabled" (click)="this.choice($event)">{{btn_translation |translate}}</button>
  </div>
      

</body>
