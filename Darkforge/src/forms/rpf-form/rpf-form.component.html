<!DOCTYPE html>
<meta charset="utf-8">
<head>

</head>

<body>
    

    <canvas #bmp_preview id="bmp_preview" width="256" height="256" ></canvas>

    <form [formGroup]="form">

        <div class="params">

            <label>{{'label.clut'|translate}}</label>
            
            <app-numeric id="CLUT" [max]="256" [min]="2" [default]="16" formControlName="clut"></app-numeric>

            <label for="Mode">{{'label.rpf-method'|translate}}</label>
            <select id="Mode" formControlName="mode">
                <option value='0'>{{'option.popularity'|translate}}</option>
                <option value='1'>{{'option.proximity'|translate}}</option>
            </select>

        </div>             
        

        <div class="rgb_holder">

            <div class="rgb">             

                    
                <label for="use_alpha">{{'label.alpha'|translate}}</label>
                <input id="use_alpha" type="checkbox" formControlName="use_alpha">

                
                    
            </div>           





            <div class="rgb_out" id="RGB_OUT" [ngClass]="{'hidden':form.get('use_alpha')?.value===false}">


                <div class="backdrop">                    
                    
                    <div class="rgb_s">
                        <app-slider id="r" #r_s [max]="255" formControlName="r_slider"></app-slider> 
                    </div>
                    <div class="rgb_s">
                        <app-slider id="g" #g_s [max]="255" formControlName="g_slider"></app-slider> 
                    </div>
                    <div  class="rgb_s">
                        <app-slider id="b" #b_s [max]="255" formControlName="b_slider"></app-slider> 
                    </div>
                    

                </div>


                <div class="numeric">                

                    <div class="rgb_n">
                        <app-numeric id="r_out" [max]="255" [min]="0" formControlName="r_numeric"></app-numeric>
                    </div>
                    <div class="rgb_n">
                        <app-numeric id="g_out" [max]="255" [min]="0" formControlName="g_numeric"></app-numeric>
                    </div>
                    <div class="rgb_n">
                        <app-numeric id="b_out" [max]="255" [min]="0" formControlName="b_numeric"></app-numeric>
                    </div>



                </div>


                <div  class="colour">
                  
                    <svg width="100%" height="100%" viewBox="0 0 200 200">
                        <polygon id ="colour" points="50,150 100,50 150,150 100,100" [attr.fill]="this.getRGBColor()"/>
                    </svg>


                </div>

            </div>

        </div>


        <div class="buffer_holder" id="BUFFER_HOLDER" [ngClass]="{'hidden':form.get('mode')?.value==='0'}">

            <label>{{'label.p-bfr'|translate}}</label>
            <app-numeric id="BFR" [default]="0" [step]="1" [max]="4" [min]="0" formControlName="bfr"></app-numeric>

        </div>



    </form>
       


    <div class="btn">
        <button type="button" [disabled]="!btn_enabled" (click)="this.choice($event)">{{btn_translation |translate}}</button>
    </div>
        
    

  

</body>
