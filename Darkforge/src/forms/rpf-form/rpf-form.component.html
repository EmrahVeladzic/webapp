<!DOCTYPE html>
<meta charset="utf-8">
<head>

</head>

<body>


    <canvas #bmp_preview id="bmp_preview" width="256" height="256" ></canvas>

    <form [formGroup]="form">

        <div class="params">

            <label>{{'label.clut'|translate}}</label>

            <app-numeric id="CLUT" [max]="256" [min]="2" [default]="16" formControlName="clut"></app-numeric>

            <label for="Mode">{{'label.rpf-method'|translate}}</label>
            <select id="Mode" formControlName="mode">
                <option value='0'>{{'option.popularity'|translate}}</option>
                <option value='1'>{{'option.proximity'|translate}}</option>
            </select>

        </div>


        <div class="rgb_holder">

            <div class="rgb">


                <label for="use_alpha">{{'label.alpha'|translate}}</label>
                <input id="use_alpha" type="checkbox" formControlName="use_alpha">



            </div>





            <div class="rgb_out" id="RGB_OUT" [ngClass]="{'hidden':form.get('use_alpha')?.value===false}">


                <div class="backdrop">

                    <div class="rgb_s">
                        <app-slider id="r" #r_s [max]="255" formControlName="r_slider"></app-slider>
                    </div>
                    <div class="rgb_s">
                        <app-slider id="g" #g_s [max]="255" formControlName="g_slider"></app-slider>
                    </div>
                    <div  class="rgb_s">
                        <app-slider id="b" #b_s [max]="255" formControlName="b_slider"></app-slider>
                    </div>


                </div>


                <div class="numeric">

                    <div class="rgb_n">
                        <app-numeric id="r_out" [max]="255" [min]="0" formControlName="r_numeric"></app-numeric>
                    </div>
                    <div class="rgb_n">
                        <app-numeric id="g_out" [max]="255" [min]="0" formControlName="g_numeric"></app-numeric>
                    </div>
                    <div class="rgb_n">
                        <app-numeric id="b_out" [max]="255" [min]="0" formControlName="b_numeric"></app-numeric>
                    </div>



                </div>


                <div  class="colour">

                    <svg width="100%" height="100%" viewBox="0 0 200 200">
                        <polygon id ="colour" points="50,150 100,50 150,150 100,100" [attr.fill]="this.getRGBColor()"/>
                    </svg>


                </div>

            </div>

        </div>


        <div class="vram_holder" id="VRAM_HOLDER">

            <div class="vram_holder_row">
                <label>{{'label.tex_placement'|translate}}</label>
            </div>
            <div class="vram_holder_row">
                <div class="vram_holder_third" id="TEX_ROW">
                    <app-numeric id="T_ROW" [max]="1" [min]="0" [default]="0" [step]="1" formControlName="tex_row"></app-numeric>
                </div>
                <div class="vram_holder_third" id="TEX_X">
                    <app-numeric id="T_X" #tx [max]="1008" [min]="0" [default]="0" [step]="16" formControlName="tex_x"></app-numeric>
                </div>
                <div class="vram_holder_third" id="TEX_Y">
                    <app-numeric id="T_Y" #ty [max]="255" [min]="0" [default]="0" [step]="1" formControlName="tex_y"></app-numeric>
                </div>
            </div>

            <div class="vram_holder_row">
                <label>{{'label.clut_placement'|translate}}</label>
            </div>
            <div class="vram_holder_row">
                <div class="vram_holder_third" id="CLUT_ROW">
                    <app-numeric id="C_ROW" [max]="1" [min]="0" [default]="0" [step]="1" formControlName="clut_row"></app-numeric>
                </div>
                <div class="vram_holder_third" id="CLUT_X">
                    <app-numeric id="C_X" #cx [max]="1008" [min]="0" [default]="0" [step]="16" formControlName="clut_x"></app-numeric>
                </div>
                <div class="vram_holder_third" id="CLUT_Y">
                    <app-numeric id="C_Y" [max]="255" [min]="0" [default]="0" [step]="1" formControlName="clut_y"></app-numeric>
                </div>
            </div>





        </div>


    </form>



    <div class="btn">
        <button type="button" [disabled]="!btn_enabled" (click)="this.choice($event)">{{btn_translation |translate}}</button>
    </div>




</body>
