<!DOCTYPE html>
<meta charset="utf-8">
<head>

</head>

<body>

    <output>{{transfer.model_name}}</output>

    <form [formGroup]="form">

        <div class="params">

                <div class="select_holder">

                <label for="Unit">{{'label.unit'|translate}}</label>
                <select id="Unit" formControlName="precision">
                    <option value='0'>{{'option.unit-max'|translate}} - 1</option>
                    <option value='4'>{{'option.unit-hi'|translate}} - 1/16</option>
                    <option value='8'>{{'option.unit-med'|translate}} - 1/256</option>
                    <option value='12'>{{'option.unit-low'|translate}} - 1/4096</option>
                    <option value='16'>{{'option.unit-min'|translate}} - 1/65536</option>
                </select>

                <label for="FPS">{{'label.fps'|translate}}</label>
                <select id="FPS" formControlName="fps">
                    <option value='60'>{{'option.fps-full'|translate}} - NTSC (60)</option>
                    <option value='30'>{{'option.fps-half'|translate}} - NTSC (30)</option>
                    <option value='50'>{{'option.fps-full'|translate}} - PAL (50)</option>
                    <option value='25'>{{'option.fps-half'|translate}} - PAL (25)</option>
                </select>

            </div>

            <div class="numeric_holder">

                <div class="rpf_toggle">
                    <label for="use_rpf">{{'label.use_rpf'|translate}}</label>
                    <input id="use_rpf" type="checkbox" formControlName="use_rpf">
                </div>

                <div class="tex_rpf" [ngClass]="{'collapsed':form.get('use_rpf')?.value===false}">

                    <label >{{'label.rpf_id'|translate}}</label>

                    <div class="dimensions">
                        <app-numeric #rid [max]="2147483647" [min]="0" [default]="0" [step]="1" formControlName="rpf_id"></app-numeric>
                    </div>

                </div>

                <div class="tex_manual" [ngClass]="{'collapsed':form.get('use_rpf')?.value===true}">

                <label >{{'label.target-w'|translate}}</label>

                <div class="dimensions">
                    <app-numeric #width id="X" [max]="256" [min]="16" [default]="128" [step]="16" formControlName="tex_x"></app-numeric>
                </div>


                <label >{{'label.target-h'|translate}}</label>


                <div class="dimensions">
                    <app-numeric #height id="Y" [max]="256" [min]="16" [default]="128" [step]="16"  formControlName="tex_y"></app-numeric>
                </div>

                <label >{{'label.tex_offset'|translate}}</label>
                   <div class="dimensions_dual">
                    <div class="dimensions_xy">
                        <app-numeric #tox  [max]="128" [min]="0" [default]="0" [step]="32" formControlName="tex_o_x"></app-numeric>
                    </div>
                    <div class="dimensions_xy">
                        <app-numeric #toy [max]="128" [min]="0" [default]="0" [step]="1" formControlName="tex_o_y"></app-numeric>
                    </div>

                </div>

                </div>

            </div>

        </div>

    </form>

    <div class="btn">
        <button type="button" [disabled]="!btn_enabled" (click)="this.choice($event)">{{btn_translation |translate}}</button>
    </div>


</body>
